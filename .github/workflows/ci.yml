name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 빌드 번호 = 커밋 수

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build + test + bundle
        run: scripts/verify.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .artifacts/verify
