name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 40 # swift-syntax(Tools/CodeCheck)와 Periphery 인덱스 빌드가 더해졌다
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 빌드 번호 = 커밋 수

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift lint tools
        run: |
          brew install swiftlint periphery
          swiftlint version
          periphery version

      # 빌드 → Swift 테스트(Core + App + IMK Core) → lint(셸·Swift) → 스크립트/사이트 → 내장 입력기를 포함한 KeyHue·IMK self-check
      - name: Verify
        env:
          KEYHUE_REQUIRE_SWIFT_LINT: "1"
        run: scripts/verify.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: .artifacts/verify

  lint:
    name: ShellCheck and site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck + 변수 뒤 한글 검사
        env:
          KEYHUE_REQUIRE_SHELLCHECK: "1"
        run: |
          shellcheck --version
          scripts/lint.sh
      - name: Site tests
        run: node --test Tests/site/*.test.js

  release-signing:
    # 릴리즈와 같은 서명 경로를 일회용 키로 미리 돌린다(v0.1.3 서명 실패 같은 문제를 PR에서 잡는다).
    name: Release signing path
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sign with a throwaway key
        run: Tests/ci/release-signing-check.sh
